<!DOCTYPE html>
<html lang="ca">
<head>

<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2EF;--surf:#FFFFFF;--ink:#17211F;--mut:#56635F;--line:#D9E1DC;--pri:#0E5A4B;--pri-ink:#FFFFFF;--pri-soft:#DCEEE7;--pri-soft-ink:#0B4639;--ocre:#C9861E;--ocre-soft:#FBEED6;--ocre-ink:#6F4508;--red:#B23A2A;--red-soft:#F8E1DD;--blu-soft:#E1ECF7;--blu-ink:#1B4C7A;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1514;--surf:#18201E;--ink:#E7EDEB;--mut:#9DABA6;--line:#2B3633;--pri:#55B99F;--pri-ink:#05231C;--pri-soft:#173A31;--pri-soft-ink:#B9E6D8;--ocre:#E6AA4A;--ocre-soft:#3A2B10;--ocre-ink:#F3D49C;--red:#E57364;--red-soft:#3B1C17;--blu-soft:#16283A;--blu-ink:#B7D3EE;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1514;--surf:#18201E;--ink:#E7EDEB;--mut:#9DABA6;--line:#2B3633;--pri:#55B99F;--pri-ink:#05231C;--pri-soft:#173A31;--pri-soft-ink:#B9E6D8;--ocre:#E6AA4A;--ocre-soft:#3A2B10;--ocre-ink:#F3D49C;--red:#E57364;--red-soft:#3B1C17;--blu-soft:#16283A;--blu-ink:#B7D3EE;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding-bottom:96px}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:28px;line-height:1.1}h2{font-size:21px;line-height:1.2}h3{font-size:17px}
p{margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 18px 10px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;flex:none}
.logo-img{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);object-fit:contain;padding:3px;flex:none}
.logo-full{display:block;width:100%;max-width:300px;height:auto;background:#fff;border-radius:18px;padding:14px 18px}
.top .t1{font-weight:600;font-size:15px;line-height:1.2}.top .t2{font-size:13px;color:var(--mut)}
.back{border:0;background:var(--surf);width:42px;height:42px;border-radius:12px;color:var(--ink);font-size:20px;cursor:pointer;flex:none}
main{padding:4px 18px 0}
.sec{margin:22px 0 10px;font-size:14px;font-weight:600;color:var(--mut)}
.card{background:var(--surf);border-radius:16px;padding:14px;border:1px solid var(--line)}
.act{display:flex;gap:14px;align-items:center;width:100%;text-align:left;cursor:pointer;margin-bottom:10px;font:inherit;color:inherit}
.date{width:52px;flex:none;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.date .d{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:700;line-height:1}.date .m{font-size:12px;color:var(--mut)}
.act .n{font-weight:600}.act .s{font-size:13px;color:var(--mut)}
.price{margin-left:auto;text-align:right;font-weight:600;white-space:nowrap}.price small{display:block;font-weight:500;font-size:12px;color:var(--pri)}
.hero{background:var(--ocre-soft);color:var(--ocre-ink);border-radius:18px;padding:18px;margin-top:6px}
.hero h2{color:var(--ocre-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 18px;font:600 16px Figtree,system-ui,sans-serif;cursor:pointer;background:var(--pri);color:var(--pri-ink);min-height:48px}
.btn.full{width:100%}.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}.btn.ocre{background:var(--ocre);color:#2B1A02}
.link{background:none;border:0;color:var(--pri);font:600 15px Figtree,sans-serif;padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--ocre);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px Figtree,sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
label.f{display:block;margin:14px 0 0;font-size:14px;font-weight:600}
input[type=text],input[type=email],input[type=tel],input[type=number],select{width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:16px Figtree,sans-serif}
.err{color:var(--red);font-size:13px;margin-top:4px;min-height:0}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px}.chk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--pri)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.seg button{border:1.5px solid var(--line);background:var(--surf);color:var(--ink);border-radius:12px;padding:12px;font:600 15px Figtree,sans-serif;cursor:pointer;text-align:left}
.seg button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-soft-ink)}
.seg small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;gap:14px}.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-size:20px;cursor:pointer}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--pri-soft);color:var(--pri-soft-ink)}.tag.o{background:var(--ocre-soft);color:var(--ocre-ink)}.tag.r{background:var(--red-soft);color:var(--red)}.tag.b{background:var(--blu-soft);color:var(--blu-ink)}.tag.g{background:var(--line);color:var(--ink)}
.carnet{background:var(--pri);color:var(--pri-ink);border-radius:22px;padding:20px;position:relative;overflow:hidden}
.carnet::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;border:28px solid rgba(255,255,255,.08)}
.carnet .nm{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;font-weight:700;line-height:1.05;margin:18px 0 4px}
.carnet .qr{background:#fff;border-radius:10px;padding:6px;width:96px;height:96px;flex:none;margin-left:10px}
.carnet .nm{overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;cursor:pointer;font:inherit;color:inherit;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.tile .ic{font-size:24px}.tile b{font-weight:600}
.metric{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px}.metric .v{font-family:"Bricolage Grotesque",sans-serif;font-size:28px;font-weight:700}.metric .l{font-size:13px;color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--pri)}
.pin{display:flex;gap:12px;justify-content:center;margin:20px 0}.pin span{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}.pin span.f{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}.pad button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:600 22px Figtree,sans-serif;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:440px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav button{background:none;border:0;color:var(--mut);font:500 12px Figtree,sans-serif;padding:10px 0 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px}nav button.on{color:var(--pri);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;z-index:20;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.sumup{border:1px dashed var(--line);border-radius:16px;padding:16px;background:var(--surf)}
.ok{width:72px;height:72px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;margin:30px auto 16px;font-size:36px}
.muted{color:var(--mut);font-size:14px}
.demo{font-size:12px;color:var(--mut);text-align:center;margin:26px 0 8px}
.cartell{position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;padding:24px;display:flex;flex-direction:column;justify-content:flex-end}
.ct-dec{position:absolute;inset:0;width:100%;height:100%}
.ct-top{position:absolute;top:22px;left:24px;font-size:13px;font-weight:600}
.ct-t{position:relative;font-family:"Bricolage Grotesque",sans-serif;font-size:46px;line-height:.95;font-weight:700;letter-spacing:-.02em}
.ct-d{position:relative;font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-weight:700;margin-top:14px}
.ct-l{position:relative;font-size:15px;font-weight:500}
.mi{width:42px;height:42px;border-radius:12px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center}.mi svg{width:24px;height:24px}
.tline{margin-top:18px;border-left:2px solid var(--line);margin-left:6px}
.tl-i{position:relative;padding:0 0 22px 22px}.tl-i::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--pri)}
.tl-h{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:20px;line-height:1.2}.tl-t{color:var(--mut)}
textarea.fi{width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:16px Figtree,sans-serif;resize:vertical}
.mini{display:flex;flex-wrap:wrap;gap:0 16px;margin-top:2px}.mini .link{font-size:14px;padding:6px 0}.mini .link.m{color:var(--mut)}
.conf{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:14px}.conf .bs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
input[type=date],input[type=time],textarea{width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:16px Figtree,sans-serif}textarea{resize:vertical}input[readonly],select:disabled{opacity:.65}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.qty{display:flex;align-items:center;gap:12px;flex:none}.qty button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--pri);background:var(--surf);color:var(--pri);font:600 20px Figtree,sans-serif;cursor:pointer}.qty button:disabled{opacity:.35;cursor:default}.qty b{min-width:20px;text-align:center;font-size:18px}
.qrbox{background:#fff;padding:16px;border-radius:16px;width:max-content;margin:18px auto 8px;min-width:240px;min-height:240px}.qrbox img,.qrbox canvas{display:block}
.codi{text-align:center;font:700 22px "Bricolage Grotesque",sans-serif;letter-spacing:3px;margin:4px 0}
.avis-ko{background:var(--red-soft);border-color:var(--red);color:var(--ink)}.avis-ok{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-soft-ink)}.avis-o{background:var(--ocre-soft);border-color:var(--ocre);color:var(--ocre-ink)}
.cam{position:relative;margin-top:14px;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1}.cam video{width:100%;height:100%;object-fit:cover;display:block}.mira{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:16px}
.res{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;font-size:17px;gap:4px}.res:empty{display:none}.res b{display:block;font-size:24px;margin-bottom:6px}.res .btn{margin-top:14px;min-width:70%}.res .link{color:inherit}.res.r-ok{background:#E3F4EC;color:#0B4639}.res.r-ja{background:#FBEED6;color:#6F4508}.res.r-ko{background:#F8E1DD;color:#8E2A1E}.res.r-wait{background:rgba(0,0,0,.55);color:#fff}.res.r-ok .btn{background:#0E5A4B;color:#fff}.res.r-ja .btn{background:#6F4508;color:#fff}.res.r-ko .btn{background:#B23A2A;color:#fff}
.arr-est{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap}.arr-est.si{background:var(--pri-soft);color:var(--pri-soft-ink)}
.wz-bar{display:flex;gap:4px;margin:4px 0 10px}.wz-bar i{flex:1;height:5px;border-radius:3px;background:var(--line)}.wz-bar i.on{background:var(--pri)}.wz-bar i.skip{background:transparent;border:1px dashed var(--mut)}
.wz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.wz-nav .btn{flex:1}
.wz-ent{margin-top:10px}.wz-par{margin-top:8px}.wz-ag{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;margin-top:8px}
.wz-img{position:relative;margin-top:8px}.wz-img img{width:100%;max-height:320px;object-fit:contain;border-radius:14px;background:var(--line);display:block}.wz-img .tag{position:absolute;top:8px;left:8px}
.wz-foto{display:block;margin-top:8px;border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--mut);font-size:14px;cursor:pointer}.wz-foto input{display:block;margin:0 auto 8px;font-size:14px;max-width:100%}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);font:16px Figtree,sans-serif;cursor:pointer}.opt.on{border:2px solid var(--pri);background:var(--pri-soft);color:var(--pri-soft-ink)}.opt b{display:block;margin-bottom:2px}.opt:disabled{opacity:.5;cursor:default}
.cartell-img{width:100%;border-radius:18px;display:block;object-fit:cover;max-height:520px;background:var(--line)}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<nav><div class="in" id="nav"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const QUOTA = 12;
const CURSOS = [
  {id:'ioga', nom:'Ioga', cat:'Moviment', dia:'Dilluns i dimecres', h:'9:30 a 10:30', prof:'Clara', ps:60, pn:75, places:16, ocup:16},
  {id:'pilates', nom:'Pilates', cat:'Moviment', dia:'Dimarts i dijous', h:'19:00 a 20:00', prof:'Laura', ps:60, pn:75, places:14, ocup:11},
  {id:'taitxi', nom:'Tai-txi', cat:'Moviment', dia:'Divendres', h:'10:00 a 11:00', prof:'Joan', ps:35, pn:45, places:20, ocup:9},
  {id:'angles', nom:'Anglès conversa', cat:'Aprendre', dia:'Dimecres', h:'18:00 a 19:30', prof:'Sarah', ps:50, pn:65, places:12, ocup:12},
  {id:'info', nom:'Informàtica i mòbil', cat:'Aprendre', dia:'Dijous', h:'11:00 a 12:30', prof:'Pere', ps:30, pn:40, places:10, ocup:6},
  {id:'costura', nom:'Costura', cat:'Creativitat', dia:'Dimarts', h:'17:00 a 19:00', prof:'Rosa', ps:45, pn:60, places:12, ocup:8},
  {id:'pintura', nom:'Pintura i dibuix', cat:'Creativitat', dia:'Dilluns', h:'17:30 a 19:30', prof:'Toni', ps:45, pn:60, places:12, ocup:10}
];
const ORG = {ioga:'Montse', pilates:'Montse', taitxi:'Jordi', angles:'Núria', info:'Pere', costura:'Rosa', pintura:'Anna'};
CURSOS.forEach(c => c.org = ORG[c.id]);
const AVISOS = [
  {c:'ioga', d:'5 nov.', t:'Dilluns 8 de desembre no hi ha classe perquè és festiu.', de:'Montse, organitzadora'},
  {c:'costura', d:'4 nov.', t:'Per a la propera classe porteu una peça de roba per arreglar.', de:'Rosa, professora'},
  {c:'angles', d:'3 nov.', t:'La classe d’aquesta setmana es fa a la sala 2.', de:'Sarah, professora'},
  {c:'pintura', d:'2 nov.', t:'Dilluns comencem amb aquarel·la. Porteu pinzells fins.', de:'Toni, professor'}
];
const curs = id => CURSOS.find(c => c.id === id);
// ===== Connexió amb el motor d'accés (Apps Script del full de socis) =====
const MOTOR = 'https://script.google.com/macros/s/AKfycbxNeEcaHhN8SjH7W2cjmJyPAxlmYY7vP-Ic8kJQ28GtfK09pbjvBpb2hJFMF_JVuxu2/exec';
const PROVES = true; // versió de proves: cursos i alta de socis dins l'app encara són d'exemple
function motor(accio, dades){
  return fetch(MOTOR, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({accio}, dades || {}))})
    .then(r => r.json()).catch(() => ({ok:false, codi:'XARXA'}));
}
function token(){ try { return localStorage.getItem('avv-token') || ''; } catch(e){ return S._tk || ''; } }
function desaToken(t){ try { if (t) localStorage.setItem('avv-token', t); else localStorage.removeItem('avv-token'); } catch(e){ S._tk = t; } }
const MSG = {XARXA:'No hi ha connexió. Torna-ho a provar.', SERVEI:'Ara mateix el servei no respon. Torna-ho a provar d’aquí a una estona.', BLOQUEJAT:'Has fet massa intents. Torna-ho a provar d’aquí a 15 minuts.', DNI_FORMAT:'Aquest DNI o NIE no és correcte. Revisa els números i la lletra.', CADUCAT:'Aquest codi ha caducat. Demana’n un de nou.', ESGOTAT:'Has esgotat els intents d’aquest codi. Demana’n un de nou.', FORMAT:'El codi té 6 xifres. Copia’l tal com surt al correu.'};
function aplicaPerfil(p, dni){
  if (!p){ S.soci = null; S.rol = 'visitant'; S.user = null; return; }
  const nom = [p.nom, p.cognoms].filter(Boolean).join(' ');
  S.soci = {nom, dni: dni || (S.soci && S.soci.dni) || '', email:p.email || '', tel:'', num:p.num, estat: p.quota === 'pagada' ? 'pagada' : 'pendent'};
  S.rol = 'soci';
  S.user = {nom, cursos:[], escriu:{}, junta: /junta|tresor|presid|secret/i.test(p.rol || '')};
  if (p.privacitat) marcaPriv();
}
// Entrada a mig fer: si l'usuari surt a mirar el correu i el navegador recarrega la pàgina, hi tornem
const PEND_MIN = 10;
function desaPendent(){ try { localStorage.setItem('avv-pendent', JSON.stringify({dni:S.idDni, t:Date.now(), after:S.after || null, afterTab:S.afterTab || null})); } catch(e){} }
function esborraPendent(){ try { localStorage.removeItem('avv-pendent'); } catch(e){} }
function llegeixPendent(){ try { const p = JSON.parse(localStorage.getItem('avv-pendent') || 'null'); if (p && Date.now() - p.t < PEND_MIN * 60000) return p; esborraPendent(); } catch(e){} return null; }
// Instal·lar l'app
let instPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instPrompt = e; if (typeof render === 'function') render(); });
window.addEventListener('appinstalled', () => { instPrompt = null; S.instAjuda = false; toast('App instal·lada. La trobaràs a la pantalla d’inici.'); render(); });
const instalada = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;

  if (max === 0) return 'gratuïta';
  if (min === 0) return 'gratuïta o des de ' + eur(Math.min(...v.filter(x => x > 0)));

}

function sumaDurada(base, n, u){

function filaEvent(e){

function sumaDies(dia, n){ const [y, m, d] = dia.split('-').map(Number); const x = new Date(y, m - 1, d + n); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }

// Afegir al calendari del veí
const utc = ms => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
const peuCal = 'AVV Pla de Palau – Sant Pau · app.avsantpau.cat';
function googleCal(e){
  const dates = e.tot ? `${e.dia.replace(/-/g,'')}/${e.diaFi.replace(/-/g,'')}` : `${utc(e.ini)}/${utc(e.fi)}`;

function baixaIcs(e){
  const t = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AVV Pla de Palau Sant Pau//App//CA','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    'UID:' + e.id.replace(/@.*/, '').replace(/[^\w-]/g, '') + '-' + e.dia + '@avsantpau.cat', 'DTSTAMP:' + utc(Date.now())];
  if (e.tot) L.push('DTSTART;VALUE=DATE:' + e.dia.replace(/-/g,''), 'DTEND;VALUE=DATE:' + e.diaFi.replace(/-/g,''));
  else L.push('DTSTART:' + utc(e.ini), 'DTEND:' + utc(e.fi));
  L.push('SUMMARY:' + t(e.t));
  if (e.lloc) L.push('LOCATION:' + t(e.lloc));
  L.push('DESCRIPTION:' + t([e.desc, peuCal].filter(Boolean).join('\n\n')), 'END:VEVENT', 'END:VCALENDAR');
  const txt = L.join('\r\n');
  if (esIOS()){ location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(txt); return; }
  const url = URL.createObjectURL(new Blob([txt], {type:'text/calendar;charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = (e.t.replace(/[^\wÀ-ÿ -]/g, '').trim() || 'reunio') + '.ics';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000);
}

/* --- Enllaços que arriben per correu, des de SumUp o des d'un QR escanejat amb la càmera --- */
function rutaHash(){
  const mc = location.href.match(/#act\.([a-z0-9-]+)/);
  if (mc){ S.sub = {v:'detall', id:mc[1], enllac:true}; return true; }
  const ma = location.href.match(/#arr\.([a-z0-9-]+)(?:\.(\d{4}))?/);
  if (ma){
    if (ma[2]){ S.pins = S.pins || {}; S.pins[ma[1]] = ma[2]; desaPins(); }
    history.replaceState(null, '', location.pathname + '#arr.' + ma[1]);   // el PIN no es queda a la barra d'adreces
    S.arr = {}; S.sub = {v:'arribades', id:ma[1]};
    return true;
  }
  const m = location.href.match(/#(v|ins|pagar|pagat)\.([A-Z0-9]{6})\.([0-9a-f]{20})/);
  if (!m) return false;
  const [, t, c, s] = m;
  // L'adreça queda com #ins.CODI.SIG (o #v.…): recarregar torna a obrir la inscripció, però mai no torna a pagar sol
  history.replaceState(null, '', location.pathname + '#' + (t === 'v' ? 'v' : 'ins') + '.' + c + '.' + s);
  if (t !== 'v') desaInsCodi(c, s);
  S.insV = {};
  S.sub = {v: t === 'v' ? 'qr' : 'ins', c, s, comprova: t === 'pagat', paga: t === 'pagar'};
  return true;
}

function carregaIns(){
  const s = S.sub;
  if (!s || S.insCarr === s.c) return;
  S.insCarr = s.c; S.insErr = '';
  motor('estatInscripcio', {c:s.c, s:s.s, comprova:!!s.comprova}).then(r => {
    S.insCarr = null;
    if (!r.ok){ S.insErr = r.codi === 'QR_FALS' ? 'Aquest codi no és vàlid.' : r.codi === 'NO_TROBAT' ? 'No hem trobat aquesta inscripció.' : msgJ(r); if (S.sub === s) render(); return; }
    S.insV = S.insV || {}; S.insV[s.c] = r.ins;
    if (s.comprova && r.ins.estat === 'CONFIRMADA'){ toast('Pagament rebut. Ja tens el QR.'); carregaMeves(); carregaActivitats(); }
    if (s.paga && r.ins.estat === 'PENDENT_PAGAMENT'){ s.paga = false; pagaIns(s.c, s.s); }
    if (S.sub === s) render();
  });
}
function pagaIns(c, s, b){

    render();
  });
}

function estimaImport(a, F){
  const tot = F.q.reduce((s, x) => s + x, 0);
  const extra = Object.keys(F.v).filter(k => /^sx\d+$/.test(k) && +k.slice(2) < tot - 1 && isDni(F.v[k] || '')).length;
  const nSoci = a.mode === 'GRUP' ? (esSoci() ? tot : 0) : a.mode === 'PER' ? Math.min(tot, (esSoci() ? 1 : 0) + extra) : 0;
  const u = [];
  a.ent.forEach((e, i) => { for (let k = 0; k < F.q[i]; k++) u.push(e); });
  u.sort((x, y) => (y.pn - y.ps) - (x.pn - x.ps));
  return Math.round(u.reduce((s, e, k) => s + (k < nSoci ? e.ps : e.pn), 0) * 100) / 100;
}

function enviaIns(b){
  const a = act(S.sub.id), F = S.fi;
  if (!a || !F) return;
  const tot = F.q.reduce((s, x) => s + x, 0);
  let ok = true;
  if (!tot){ err('fins', 'Tria quantes places vols.'); ok = false; }
  if (!req([['fn','Escriu el nom i cognoms'],['fe','Escriu un correu vàlid: hi rebràs el QR',isMail],['ft','Escriu un telèfon de contacte']])) ok = false;
  const amb = esSoci() && token();
  if (!amb && !req([['fd','Aquest DNI o NIE no és correcte',isDni]])) ok = false;
  a.preg.forEach(q => { if (q.oblig && !String(F.v[q.id] || '').trim()){ err(q.id, 'Respon aquesta pregunta'); ok = false; } });
  if (!F.v.fr){ err('fr', 'Cal acceptar-ho per poder fer la inscripció'); ok = false; }
  if (!ok){ const e = document.querySelector('.err:not(:empty)'); if (e) e.scrollIntoView({block:'center'}); return; }
  const resp = {}; a.preg.forEach(q => { if (F.v[q.id] != null) resp[q.id] = F.v[q.id]; });
  const socis = Object.keys(F.v).filter(k => /^sx\d+$/.test(k) && +k.slice(2) < tot - 1).map(k => String(F.v[k] || '').trim()).filter(Boolean);
  const txt = b.textContent; b.disabled = true; b.textContent = 'Enviant…';
  motor('inscriure', {codi:a.codi, token:token(), nom:val('fn'), email:val('fe'), tel:val('ft'), dni:amb ? '' : val('fd'), n:F.q, socis, resp, rgpd:true}).then(r => {
    b.disabled = false; b.textContent = txt;
    if (r.codi === 'JA_INSCRIT' && r.c){ desaInsCodi(r.c, r.s); S.insV = {}; sub({v:'ins', c:r.c, s:r.s, up:{v:'detall', id:a.codi}}); toast('Ja hi estaves inscrit'); return; }
    if (!r.ok){ err('fins', r.msg || msgJ(r)); return; }
    desaInsCodi(r.c, r.s); S.fi = null; S.insV = {}; carregaMeves(); carregaActivitats();
    toast(r.estat === 'CONFIRMADA' ? 'Inscripció confirmada' : r.estat === 'LLISTA_ESPERA' ? 'T’hem apuntat a la llista d’espera' : 'Plaça reservada: falta pagar');
    sub({v:'ins', c:r.c, s:r.s, paga: r.estat === 'PENDENT_PAGAMENT', up:{v:'detall', id:a.codi}});
  });
}

let CAM = null;
function aturaCamera(){
  if (!CAM) return;
  CAM.on = false;
  try { CAM.stream.getTracks().forEach(t => t.stop()); } catch(e){}
  CAM = null;
}
async function iniciaCamera(id){
  if (CAM) return;
  const v = document.getElementById('cam');
  if (!v) return;
  CAM = {on:true, id, ultim:'', t:0, ocupat:false, stream:null};
  const est = t => { const e = document.getElementById('camEst'); if (e) e.textContent = t; };
  try {
    CAM.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    if (!CAM || !CAM.on){ CAM && aturaCamera(); return; }
    v.srcObject = CAM.stream; await v.play();
    let det = null;
    if ('BarcodeDetector' in window){ try { det = new BarcodeDetector({formats:['qr_code']}); } catch(e){} }
    if (!det){
      try { await carregaScript(LIB_JSQR); }
      catch(e){ est('No s’ha pogut carregar el lector de QR. Comprova la connexió i torna a entrar, o fes servir la cerca per nom.'); aturaCamera(); return; }
    }
    const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently:true});
    const bucle = async () => {
      if (!CAM || !CAM.on) return;
      if (!CAM.ocupat && !CAM.pausa && v.readyState >= 2){
        let txt = '';
        try {
          if (det){ const r = await det.detect(v); if (r[0]) txt = r[0].rawValue; }
          else if (window.jsQR){
            const k = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight));
            cv.width = Math.round(v.videoWidth * k); cv.height = Math.round(v.videoHeight * k);
            cx.drawImage(v, 0, 0, cv.width, cv.height);
            const r = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height);
            if (r) txt = r.data;
          }
        } catch(e){}
        if (txt) llegitQR(txt);
      }
      setTimeout(bucle, 200);
    };
    bucle();
  } catch(e){
    aturaCamera();
    est('No es pot fer servir la càmera. Dona permís a la càmera al navegador, o torna enrere i fes servir la cerca per nom.');
  }
}
function llegitQR(txt){
  CAM.pausa = true;    // no es llegeix cap altre QR fins que el validador prem «Entesos, continuar»
  const m = String(txt).match(/v\.([A-Z0-9]{6})\.([0-9a-f]{20})/);
  if (!m){ resultatQR('ko', 'QR no vàlid', 'Aquest QR no és d’una inscripció de l’associació.'); return; }
  CAM.ocupat = true;
  resultatQR('wait', 'Comprovant…');
  const id = CAM.id;
  motor('registraArribada', {c:m[1], s:m[2], act:id, token:token(), pin:(S.pins || {})[id] || ''}).then(r => {
    if (CAM) CAM.ocupat = false;
    if (S.arr) delete S.arr[id];
    const ins = r.ins, qui = ins ? `${ins.nom} · ${ins.q}` : '';
    if (r.ok && !r.ja) resultatQR('ok', 'Arribada registrada', qui, ins.c);
    else if (r.ok) resultatQR('ja', 'Ja havia arribat' + (ins.hora ? ' a les ' + ins.hora : ''), qui);
    else if (r.codi === 'ALTRA_ACT') resultatQR('ko', 'És d’una altra activitat', r.msg.replace(/^Aquest QR és d['’]una altra activitat: /, '').replace(/\.$/, '') + (qui ? ' · ' + qui : ''));
    else if (r.codi === 'NO_CONFIRMADA') resultatQR('ko', 'Inscripció no confirmada', (qui ? qui + ' · ' : '') + 'Estat: ' + ((ESTAT_INS[ins && ins.estat] || ['desconegut'])[0]).toLowerCase());
    else if (r.codi === 'QR_FALS') resultatQR('ko', 'QR fals o alterat', 'Aquest codi no ha estat generat per l’associació.');
    else if (r.codi === 'NO_TROBAT') resultatQR('ko', 'Inscripció no trobada', 'Potser s’ha esborrat del full.');
    else resultatQR('ko', 'No s’ha pogut comprovar', r.msg || msgJ(r));
  });
}
function resultatQR(tipus, titol, detall, codi){
  const e = document.getElementById('res');
  if (!e) return;
  e.className = 'res r-' + tipus;
  e.innerHTML = `<b>${tipus === 'ok' ? '✓ ' : tipus === 'ko' ? '✕ ' : ''}${esc(titol)}</b>${detall ? `<div>${esc(detall)}</div>` : ''}`
    + (tipus === 'wait' ? '' : `<button class="btn" data-a="qrSeg">Entesos, continuar</button>${codi ? `<button class="link" data-a="qrDesf" data-c="${esc(codi)}">Desfer aquesta arribada</button>` : ''}`);
  if (navigator.vibrate && tipus !== 'wait') navigator.vibrate(tipus === 'ok' ? 120 : tipus === 'ko' ? [120, 80, 120, 80, 120] : [60, 60, 60]);
}

const avuiISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const isoDe = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const dataDe = (dia, hora) => { const m = String(dia || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return null; const h = String(hora || '').match(/^(\d{1,2}):(\d{2})$/); return new Date(+m[1], +m[2] - 1, +m[3], h ? +h[1] : 0, h ? +h[2] : 0); };
const numW = x => Math.round((parseFloat(String(x == null ? '' : x).replace(',', '.')) || 0) * 100) / 100;
function wzCategoria(d){ return d.cat === '__nova' ? String(d.catNova || '').trim() : d.cat; }
function wzValida(pas){
  const d = S.wz.d;
  if (pas === 1){
    if (!String(d.nom).trim()) return 'Escriu el nom de l’activitat.';
    const ini = dataDe(d.data, d.hIni);
    if (!ini) return 'Tria la data.';
    if (!S.wz.edit && d.data < avuiISO()) return 'La data no pot ser anterior a avui.';
    if (d.cat === '__nova' && !String(d.catNova || '').trim()) return 'Escriu el nom de la categoria nova.';
    if (d.multi){ if (!d.dataFi || d.dataFi <= d.data) return 'La data de final ha de ser posterior a la data.'; }
    else if (d.hFi){ if (!d.hIni) return 'Si poses hora de final, posa també l’hora d’inici.'; if (d.hFi <= d.hIni) return 'L’hora de final ha de ser posterior a l’hora d’inici.'; }
    if (S.wz.puja) return 'Espera que acabi de pujar la imatge.';
  }
  if (pas === 3 && d.ins){
    const ent = d.ent.filter(e => String(e.t || '').trim());
    if (!ent.length) return 'Cal com a mínim un tipus d’entrada.';
    if (d.mode !== 'NO' && ent.every(e => numW(e.ps) === numW(e.pn))) return 'Has triat preu de soci, però els preus de soci i no soci són iguals.';
    if (ent.some(e => numW(e.pn) < 0 || numW(e.ps) < 0)) return 'Els preus no poden ser negatius.';
    if (!(+d.max >= 1)) return 'El màxim per inscripció ha de ser 1 o més.';
    if (S.wz.teIns && +d.afor > 0 && +d.afor < S.wz.ocup) return `Ja hi ha ${S.wz.ocup} places ocupades: el total no pot ser més baix.`;
    const ob = dataDe(d.obreD, d.obreH || '00:00'), tc = dataDe(d.tancaD, d.tancaH || '23:59');
    if (!ob || !tc) return 'Falten les dates d’obertura o de tancament de les inscripcions.';
    if (tc <= ob) return 'El tancament ha de ser posterior a l’obertura.';

function pinKey(k){
  if (k === '⌫') S.pin = S.pin.slice(0,-1);
  else if (S.pin.length < 4) S.pin += k;
  render();
  if (S.pin.length === 4){
    if (S.pin === '1234'){ S.junta = true; S.pin = ''; toast('Accés de junta activat'); render(); }
    else { S.pin = ''; render(); err('pin','PIN incorrecte. Torna-ho a provar.'); }
  }
}
function desa(){ try { const log = !!(S.user || S.soci); if (log) localStorage.setItem('avv-sessio-v2', JSON.stringify({rol:S.rol, soci:S.soci, user:S.user})); else localStorage.removeItem('avv-sessio-v2'); localStorage.removeItem('avv-sessio'); sessionStorage.setItem('avv-convidat', (!log && S.entrat) ? '1' : ''); } catch(e){} }
function recupera(){ try { const d = JSON.parse(localStorage.getItem('avv-sessio-v2') || 'null'); if (d && (d.user || d.soci)){ Object.assign(S, d); S.entrat = true; } else if (sessionStorage.getItem('avv-convidat') === '1') S.entrat = true; } catch(e){} }
recupera();
// Avisos i agenda: es mostra al moment l'última còpia d'aquest mòbil i s'actualitza en segon pla
function oblidaAgenda(){ S.ag = null; try { localStorage.removeItem('avv-agenda'); } catch(e){} S.agCarr = false; carregaAgenda(); }
try { const c = JSON.parse(localStorage.getItem('avv-agenda') || 'null'); if (c && c.ok && (token() || c.nivell === 'convidat')) S.ag = c; } catch(e){}
document.addEventListener('change', e => { if (e.target.id === 'vn') actCad(); });
document.addEventListener('change', e => {
  const t = e.target, ds = t.dataset || {};
  if (t.id === 'wfoto' && t.files && t.files[0]){ pujaFoto(t.files[0]); return; }
  if (ds.fi !== undefined && S.fi) S.fi.v[ds.fi] = t.type === 'checkbox' ? t.checked : t.value;
  if (ds.wr !== undefined && S.wz){ wzLlegeix(); render(); }
});
document.addEventListener('input', e => {
  const t = e.target, ds = t.dataset || {};
  if (ds.fi !== undefined && S.fi) S.fi.v[ds.fi] = t.type === 'checkbox' ? t.checked : t.value;
  if (t.id === 'cerca'){ const q = t.value.trim().toLowerCase(); document.querySelectorAll('.arr[data-q]').forEach(r => { r.style.display = !q || r.dataset.q.includes(q) ? '' : 'none'; }); }
});
carregaAgenda();
try { const c = JSON.parse(localStorage.getItem('avv-activitats') || 'null'); if (c && c.ok) S.acts = c; } catch(e){}
carregaActivitats();
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ aturaCamera(); return; }
  if (S.sub && S.sub.v === 'escaner') render();
  if (S.acts && Date.now() - S.acts.generat > 5 * 60000) carregaActivitats();
});
if (!token()){ const pd = llegeixPendent(); if (pd){ S.idDni = pd.dni; S.idPas = true; S.rsT = pd.t + 60000; S.after = pd.after; S.afterTab = pd.afterTab; S.sub = {v:'ident'}; } }
if (!token() && (S.soci || S.user)){ S.soci = null; S.user = null; S.rol = 'visitant'; S.entrat = false; }
if (token()) motor('sessio', {token:token()}).then(r => {
  if (r.ok){ aplicaPerfil(r.perfil); if (!r.perfil) toast('No consta com a soci aquest any. Escriu-nos si és un error.'); render(); }
  else if (r.codi === 'SESSIO_CADUCADA'){ desaToken(''); S.soci = null; S.user = null; S.rol = 'visitant'; S.entrat = false; S.sub = null; oblidaAgenda(); render(); toast('La sessió ha caducat. Torna a entrar amb el teu DNI.'); }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('hashchange', () => { if (rutaHash()){ render(); return; } if (!S.keep) S.sub = null; S.keep = false; render(); window.scrollTo(0,0); });
try { S.pins = JSON.parse(localStorage.getItem('avv-pins') || '{}') || {}; } catch(e){ S.pins = {}; }
try { const mv = JSON.parse(localStorage.getItem('avv-meves') || 'null'); if (Array.isArray(mv)) S.meves = mv; } catch(e){}
rutaHash();
carregaMeves();
render();
</script>
</body>
</html>
