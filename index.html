<style>
:root{--bg:#EEF2EF;--surf:#FFFFFF;--ink:#17211F;--mut:#56635F;--line:#D9E1DC;--pri:#0E5A4B;--pri-ink:#FFFFFF;--pri-soft:#DCEEE7;--pri-soft-ink:#0B4639;--ocre:#C9861E;--ocre-soft:#FBEED6;--ocre-ink:#6F4508;--red:#B23A2A;--red-soft:#F8E1DD;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1514;--surf:#18201E;--ink:#E7EDEB;--mut:#9DABA6;--line:#2B3633;--pri:#55B99F;--pri-ink:#05231C;--pri-soft:#173A31;--pri-soft-ink:#B9E6D8;--ocre:#E6AA4A;--ocre-soft:#3A2B10;--ocre-ink:#F3D49C;--red:#E57364;--red-soft:#3B1C17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1514;--surf:#18201E;--ink:#E7EDEB;--mut:#9DABA6;--line:#2B3633;--pri:#55B99F;--pri-ink:#05231C;--pri-soft:#173A31;--pri-soft-ink:#B9E6D8;--ocre:#E6AA4A;--ocre-soft:#3A2B10;--ocre-ink:#F3D49C;--red:#E57364;--red-soft:#3B1C17;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding-bottom:96px}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:28px;line-height:1.1}h2{font-size:21px;line-height:1.2}h3{font-size:17px}
p{margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 18px 10px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;flex:none}
.logo-img{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);object-fit:contain;padding:3px;flex:none}
.logo-full{display:block;width:100%;max-width:300px;height:auto;background:#fff;border-radius:18px;padding:14px 18px}
.top .t1{font-weight:600;font-size:15px;line-height:1.2}.top .t2{font-size:13px;color:var(--mut)}
.back{border:0;background:var(--surf);width:42px;height:42px;border-radius:12px;color:var(--ink);font-size:20px;cursor:pointer;flex:none}
main{padding:4px 18px 0}
.sec{margin:22px 0 10px;font-size:14px;font-weight:600;color:var(--mut)}
.card{background:var(--surf);border-radius:16px;padding:14px;border:1px solid var(--line)}
.act{display:flex;gap:14px;align-items:center;width:100%;text-align:left;cursor:pointer;margin-bottom:10px;font:inherit;color:inherit}
.date{width:52px;flex:none;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.date .d{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:700;line-height:1}.date .m{font-size:12px;color:var(--mut)}
.act .n{font-weight:600}.act .s{font-size:13px;color:var(--mut)}
.price{margin-left:auto;text-align:right;font-weight:600;white-space:nowrap}.price small{display:block;font-weight:500;font-size:12px;color:var(--pri)}
.hero{background:var(--ocre-soft);color:var(--ocre-ink);border-radius:18px;padding:18px;margin-top:6px}
.hero h2{color:var(--ocre-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 18px;font:600 16px Figtree,system-ui,sans-serif;cursor:pointer;background:var(--pri);color:var(--pri-ink);min-height:48px}
.btn.full{width:100%}.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}.btn.ocre{background:var(--ocre);color:#2B1A02}
.link{background:none;border:0;color:var(--pri);font:600 15px Figtree,sans-serif;padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--ocre);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px Figtree,sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
label.f{display:block;margin:14px 0 0;font-size:14px;font-weight:600}
input[type=text],input[type=email],input[type=tel],input[type=number],select{width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:16px Figtree,sans-serif}
.err{color:var(--red);font-size:13px;margin-top:4px;min-height:0}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px}.chk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--pri)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.seg button{border:1.5px solid var(--line);background:var(--surf);color:var(--ink);border-radius:12px;padding:12px;font:600 15px Figtree,sans-serif;cursor:pointer;text-align:left}
.seg button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-soft-ink)}
.seg small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;gap:14px}.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-size:20px;cursor:pointer}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--pri-soft);color:var(--pri-soft-ink)}.tag.o{background:var(--ocre-soft);color:var(--ocre-ink)}.tag.r{background:var(--red-soft);color:var(--red)}
.carnet{background:var(--pri);color:var(--pri-ink);border-radius:22px;padding:20px;position:relative;overflow:hidden}
.carnet::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;border:28px solid rgba(255,255,255,.08)}
.carnet .nm{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;font-weight:700;line-height:1.05;margin:18px 0 4px}
.carnet .qr{background:#fff;border-radius:10px;padding:6px;width:96px;height:96px;flex:none;margin-left:10px}
.carnet .nm{overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;cursor:pointer;font:inherit;color:inherit;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.tile .ic{font-size:24px}.tile b{font-weight:600}
.metric{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px}.metric .v{font-family:"Bricolage Grotesque",sans-serif;font-size:28px;font-weight:700}.metric .l{font-size:13px;color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--pri)}
.pin{display:flex;gap:12px;justify-content:center;margin:20px 0}.pin span{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}.pin span.f{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}.pad button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:600 22px Figtree,sans-serif;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:440px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav button{background:none;border:0;color:var(--mut);font:500 12px Figtree,sans-serif;padding:10px 0 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px}nav button.on{color:var(--pri);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;z-index:20;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.sumup{border:1px dashed var(--line);border-radius:16px;padding:16px;background:var(--surf)}
.ok{width:72px;height:72px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;margin:30px auto 16px;font-size:36px}
.muted{color:var(--mut);font-size:14px}
.demo{font-size:12px;color:var(--mut);text-align:center;margin:26px 0 8px}
.cartell{position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;padding:24px;display:flex;flex-direction:column;justify-content:flex-end}
.ct-dec{position:absolute;inset:0;width:100%;height:100%}
.ct-top{position:absolute;top:22px;left:24px;font-size:13px;font-weight:600}
.ct-t{position:relative;font-family:"Bricolage Grotesque",sans-serif;font-size:46px;line-height:.95;font-weight:700;letter-spacing:-.02em}
.ct-d{position:relative;font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-weight:700;margin-top:14px}
.ct-l{position:relative;font-size:15px;font-weight:500}
.mi{width:42px;height:42px;border-radius:12px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center}.mi svg{width:24px;height:24px}
.tline{margin-top:18px;border-left:2px solid var(--line);margin-left:6px}
.tl-i{position:relative;padding:0 0 22px 22px}.tl-i::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--pri)}
.tl-h{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:20px;line-height:1.2}.tl-t{color:var(--mut)}
textarea.fi{width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:16px Figtree,sans-serif;resize:vertical}
.mini{display:flex;flex-wrap:wrap;gap:0 16px;margin-top:2px}.mini .link{font-size:14px;padding:6px 0}.mini .link.m{color:var(--mut)}
.conf{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:14px}.conf .bs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<nav><div class="in" id="nav"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const QUOTA = 12;
const EXTRA = {
  neu:{pc:['#1F4E79','#E6F0FA'], info:[['Sortida','7 h, plaça de l’Assumpció'],['Tornada','Cap a les 19 h'],['Cal portar','Roba d’abric, guants i ulleres de sol'],['Forfet i lloguer','A part, a l’estació'],['Contacte','Jordi, 600 111 222']], agenda:[['7:00','Sortida en autocar'],['9:30','Arribada i esmorzar'],['10:30','Esquí o passeig amb raquetes'],['14:00','Dinar lliure'],['17:00','Tornada cap a Girona']]},
  taller:{pc:['#A3302A','#FBE6E1'], info:[['Edats','De 4 a 10 anys'],['Material','Inclòs'],['Recollida','Un adult ha de venir a buscar l’infant'],['Contacte','Núria, 600 333 444']], agenda:[['17:00','Benvinguda'],['17:15','Manualitats de Nadal'],['18:30','Berenar'],['19:00','Recollida']]},
  mercat:{pc:['#9A5F0C','#FFF2DA'], info:[['Mida de la parada','2 × 1 m'],['Cal portar','Taula i cadira'],['No es pot vendre','Menjar ni productes nous'],['Si plou','Es passa al diumenge següent'],['Contacte','Marta, 600 555 666']], agenda:[['8:00','Muntatge de parades'],['9:00','Obertura al públic'],['14:00','Tancament'],['14:30','Recollida i neteja']]},
  calcots:{pc:['#2F5F10','#ECF5DF'], info:[['Menú','Calçots, carn a la brasa, postres i beguda'],['Opció vegetariana','Sí, cal indicar-ho'],['Cal portar','Pitet i ganes de festa'],['Contacte','Pere, 600 777 888']], agenda:[['12:00','Vermut'],['13:30','Calçots'],['15:00','Carn a la brasa'],['16:30','Postres i música']]}
};
const ACTS = [
  {id:'neu', d:14, m:'des.', nom:'Sortida a la neu', lloc:'La Molina', cat:'Sortides', ps:25, pn:35, u:'plaça', places:50, ocup:38, desc:'Autocar des de la plaça de l’Assumpció a les 7 h. Inclou el viatge i l’esmorzar. Forfet a part.'},
  {id:'taller', d:20, m:'des.', nom:'Taller de Nadal', lloc:'Centre cívic Pla de Palau', cat:'Infants', ps:5, pn:8, u:'infant', places:20, ocup:17, desc:'Manualitats de Nadal per a infants de 4 a 10 anys. Material inclòs.'},
  {id:'mercat', d:25, m:'gen.', nom:'Mercat de segona mà', lloc:'Plaça del barri', cat:'Barri', ps:5, pn:10, u:'parada', places:40, ocup:22, desc:'Porta el que ja no facis servir. Cada parada és de 2 × 1 m. Muntatge a partir de les 8 h.'},

];
const CURSOS = [
  {id:'ioga', nom:'Ioga', cat:'Moviment', dia:'Dilluns i dimecres', h:'9:30 a 10:30', prof:'Clara', ps:60, pn:75, places:16, ocup:16},
  {id:'pilates', nom:'Pilates', cat:'Moviment', dia:'Dimarts i dijous', h:'19:00 a 20:00', prof:'Laura', ps:60, pn:75, places:14, ocup:11},
  {id:'taitxi', nom:'Tai-txi', cat:'Moviment', dia:'Divendres', h:'10:00 a 11:00', prof:'Joan', ps:35, pn:45, places:20, ocup:9},
  {id:'angles', nom:'Anglès conversa', cat:'Aprendre', dia:'Dimecres', h:'18:00 a 19:30', prof:'Sarah', ps:50, pn:65, places:12, ocup:12},
  {id:'info', nom:'Informàtica i mòbil', cat:'Aprendre', dia:'Dijous', h:'11:00 a 12:30', prof:'Pere', ps:30, pn:40, places:10, ocup:6},
  {id:'costura', nom:'Costura', cat:'Creativitat', dia:'Dimarts', h:'17:00 a 19:00', prof:'Rosa', ps:45, pn:60, places:12, ocup:8},
  {id:'pintura', nom:'Pintura i dibuix', cat:'Creativitat', dia:'Dilluns', h:'17:30 a 19:30', prof:'Toni', ps:45, pn:60, places:12, ocup:10}
];
const ORG = {ioga:'Montse', pilates:'Montse', taitxi:'Jordi', angles:'Núria', info:'Pere', costura:'Rosa', pintura:'Anna'};
CURSOS.forEach(c => c.org = ORG[c.id]);
const AVISOS = [
  {c:'ioga', d:'5 nov.', t:'Dilluns 8 de desembre no hi ha classe perquè és festiu.', de:'Montse, organitzadora'},
  {c:'costura', d:'4 nov.', t:'Per a la propera classe porteu una peça de roba per arreglar.', de:'Rosa, professora'},
  {c:'angles', d:'3 nov.', t:'La classe d’aquesta setmana es fa a la sala 2.', de:'Sarah, professora'},
  {c:'pintura', d:'2 nov.', t:'Dilluns comencem amb aquarel·la. Porteu pinzells fins.', de:'Toni, professor'}
];
const curs = id => CURSOS.find(c => c.id === id);
ACTS.forEach(a => Object.assign(a, EXTRA[a.id]));
// ===== Connexió amb el motor d'accés (Apps Script del full de socis) =====
const MOTOR = 'https://script.google.com/macros/s/AKfycbz7VuXF5XEfaOdJBRAQnbq6vU1RUWi2p4FsVaG1E7vy2NYq-nq-aLV966t-TZeraG2y/exec';
const PROVES = true; // versió de proves: activitats, cursos i pagaments encara són d'exemple
function motor(accio, dades){
  return fetch(MOTOR, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({accio}, dades || {}))})
    .then(r => r.json()).catch(() => ({ok:false, codi:'XARXA'}));
}
function token(){ try { return localStorage.getItem('avv-token') || ''; } catch(e){ return S._tk || ''; } }
function desaToken(t){ try { if (t) localStorage.setItem('avv-token', t); else localStorage.removeItem('avv-token'); } catch(e){ S._tk = t; } }
const MSG = {XARXA:'No hi ha connexió. Torna-ho a provar.', SERVEI:'Ara mateix el servei no respon. Torna-ho a provar d’aquí a una estona.', BLOQUEJAT:'Has fet massa intents. Torna-ho a provar d’aquí a 15 minuts.', DNI_FORMAT:'Aquest DNI o NIE no és correcte. Revisa els números i la lletra.', CADUCAT:'Aquest codi ha caducat. Demana’n un de nou.', ESGOTAT:'Has esgotat els intents d’aquest codi. Demana’n un de nou.', FORMAT:'El codi té 6 xifres. Copia’l tal com surt al correu.'};
function aplicaPerfil(p, dni){
  if (!p){ S.soci = null; S.rol = 'visitant'; S.user = null; return; }
  const nom = [p.nom, p.cognoms].filter(Boolean).join(' ');
  S.soci = {nom, dni: dni || (S.soci && S.soci.dni) || '', email:p.email || '', tel:'', num:p.num, estat: p.quota === 'pagada' ? 'pagada' : 'pendent'};
  S.rol = 'soci';
  S.user = {nom, cursos:[], escriu:{}, junta: /junta|tresor|presid|secret/i.test(p.rol || '')};
  if (p.privacitat) marcaPriv();
}
// Entrada a mig fer: si l'usuari surt a mirar el correu i el navegador recarrega la pàgina, hi tornem
const PEND_MIN = 10;
function desaPendent(){ try { localStorage.setItem('avv-pendent', JSON.stringify({dni:S.idDni, t:Date.now(), after:S.after || null, afterTab:S.afterTab || null})); } catch(e){} }
function esborraPendent(){ try { localStorage.removeItem('avv-pendent'); } catch(e){} }
function llegeixPendent(){ try { const p = JSON.parse(localStorage.getItem('avv-pendent') || 'null'); if (p && Date.now() - p.t < PEND_MIN * 60000) return p; esborraPendent(); } catch(e){} return null; }
// Instal·lar l'app
let instPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instPrompt = e; if (typeof render === 'function') render(); });
window.addEventListener('appinstalled', () => { instPrompt = null; S.instAjuda = false; toast('App instal·lada. La trobaràs a la pantalla d’inici.'); render(); });
const instalada = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const esIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function botoInstal(estil){
  if (instalada()) return '';
  const ic = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3M10 18h4"/></svg>';
  let ajuda = '';
  if (S.instAjuda){
    ajuda = esIOS()
      ? `<ol style="margin:12px 0 0;padding-left:20px;font-size:14px;line-height:1.6"><li>Toca el botó <b>Compartir</b> <span aria-hidden="true">(el quadrat amb una fletxa cap amunt)</span>.</li><li>Tria <b>Afegir a la pantalla d’inici</b>.</li><li>Toca <b>Afegir</b>.</li></ol><p class="muted" style="font-size:13px;margin-top:6px">Si has obert l’enllaç des del correu o el WhatsApp, primer obre’l a Safari.</p>`

const horaTxt = d => d.getMinutes() ? `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')} h` : `${d.getHours()} h`;
const dataTxt = d => d.toLocaleDateString('ca-ES', {day:'numeric', month:'long', year:'numeric'});
const curt = (s, n) => s && s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + '…' : (s || '');
const clauEv = e => e.id + '|' + e.dia;
const MSG_J = {SESSIO_CADUCADA:'La sessió ha caducat. Torna a entrar amb el teu DNI.', NO_JUNTA:'Aquesta acció és només per a la junta.', DADES:'Revisa les dades i torna-ho a provar.', NO_TROBAT:'Aquest element ja no existeix. Torna a carregar la pantalla.'};
const msgJ = r => MSG_J[r.codi] || MSG[r.codi] || MSG.SERVEI;
// Caducitat d'un avís: n setmanes o mesos des de la data de publicació, fins al final d'aquell dia
function sumaDurada(base, n, u){
  const d = new Date(base);
  if (u === 'mesos'){ const dia = d.getDate(); d.setMonth(d.getMonth() + n); if (d.getDate() < dia) d.setDate(0); }
  else d.setDate(d.getDate() + 7 * n);
  d.setHours(23, 59, 59, 0);
  return d;
}
// Les activitats del Gestor entraran aquí directament (sense aprovació) quan el Gestor estigui connectat.

function activitatsAgenda(){ return []; }
function properes(){
  if (!S.ag) return [];

function filaAvis(a){
  const tag = a.dst ? '<span class="tag r" style="flex:none;margin-top:2px">Important</span>' : '<span class="tag o" style="flex:none;margin-top:2px">Avís</span>';
  const per = S.junta && a.dest !== 'Tots' ? `<p class="muted" style="font-size:13px;margin-top:2px">Només ${a.dest === 'Socis' ? 'per als socis' : 'per a la junta'}</p>` : '';
  return `<div class="row" style="justify-content:flex-start;gap:12px;align-items:flex-start">${tag}<div style="min-width:0"><b>${esc(a.t)}</b>${a.s ? `<p class="muted" style="white-space:pre-line">${esc(a.s)}</p>` : ''}${per}</div></div>`;
}
function filaEvent(e){
  const [, m, d] = e.dia.split('-').map(Number);
  const multi = e.tot && e.diaFi && sumaDies(e.dia, 1) !== e.diaFi;
  const quan = e.tot ? (multi ? 'Fins al ' + diaCurt(sumaDies(e.diaFi, -1)) : 'Tot el dia') : horaTxt(new Date(e.ini));
  const det = [quan, e.lloc].filter(Boolean).join(' · ');
  const k = clauEv(e);
  let h = `<div class="row" style="display:block"><div style="display:flex;gap:14px;align-items:flex-start"><div class="date" style="width:46px"><div class="d" style="font-size:22px">${d}</div><div class="m">${MESOS[m-1]}</div></div><div style="min-width:0;flex:1"><b>${esc(e.t)}</b><p class="muted">${esc(det)}</p>${e.desc ? `<p class="muted" style="font-size:13px;white-space:pre-line;margin-top:2px">${esc(curt(e.desc, 180))}</p>` : ''}`;
  h += `<div class="mini"><button class="link" data-a="afegeixCal" data-ev="${esc(k)}" aria-expanded="${S.agObre === k}">Afegeix al calendari</button>${S.junta && !e.act ? `<button class="link m" data-a="amagaQ" data-ev="${esc(k)}">Amaga</button>` : ''}</div>`;
  if (S.agObre === k) h += `<div class="conf">Tria on el vols guardar:<div class="bs"><a class="chip" href="${esc(googleCal(e))}" target="_blank" rel="noopener" style="text-decoration:none">Google Calendar</a><button class="chip" data-a="ics" data-ev="${esc(k)}">iPhone, Outlook i altres</button></div><p style="font-size:12px;margin-top:6px;color:var(--mut)">Es guarda una còpia: si després canvia l’hora o el lloc, aquí sortirà actualitzat però al teu calendari no.</p></div>`;
  if (S.agAmaga === k){
    const dades = `data-a="decideix" data-id="${esc(e.id)}" data-t="${esc(e.t)}" data-estat="Amagat"`;
    h += e.rec
      ? `<div class="conf">Aquest esdeveniment es repeteix. Què vols amagar? Al calendari de Google no es toca res.<div class="bs"><button class="btn sm ghost" ${dades} data-dia="${e.dia}">Només el ${diaCurt(e.dia)}</button><button class="btn sm ghost" ${dades}>Tota la sèrie</button><button class="link" data-a="amagaNo">Cancel·la</button></div></div>`
      : `<div class="conf">L’amaguem de l’app? Al calendari de Google no es toca res.<div class="bs"><button class="btn sm ghost" ${dades}>Amaga’l</button><button class="link" data-a="amagaNo">Cancel·la</button></div></div>`;
  }
  return h + '</div></div></div>';
}
function sumaDies(dia, n){ const [y, m, d] = dia.split('-').map(Number); const x = new Date(y, m - 1, d + n); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
function diaCurt(dia){ const [, m, d] = dia.split('-').map(Number); return `${d} ${MESOS[m-1]}`; }
function agendaAvisos(){
  const sec = '<div class="sec" style="margin-top:8px">Avisos i properes reunions</div>';
  if (!S.ag) return sec + `<div class="card"><p class="muted">${S.agErr ? 'Ara mateix no s’han pogut carregar els avisos. Torna-ho a provar d’aquí a una estona.' : 'Carregant els avisos…'}</p></div>`;
  const ara = Date.now();
  const av = S.ag.avisos.filter(a => a.cad > ara).sort((a, b) => (b.dst - a.dst) || (b.pub - a.pub));
  const evs = properes();
  let h = '';
  if (S.junta && S.ag.pendents) h += `<button class="card act" data-s="pendents" style="background:var(--ocre-soft);border-color:var(--ocre);color:var(--ocre-ink);margin-bottom:10px"><span style="font-size:22px" aria-hidden="true">📅</span><div><div class="n">${S.ag.pendents === 1 ? 'Tens 1 esdeveniment' : `Tens ${S.ag.pendents} esdeveniments`} del calendari per revisar</div><div class="s" style="color:var(--ocre-ink)">No surten a l’app fins que algú de la junta els publica</div></div><span style="margin-left:auto;font-size:22px">›</span></button>`;
  let cos = av.map(filaAvis).join('') + evs.slice(0, AG_MAX_INICI).map(filaEvent).join('');
  if (!cos) cos = '<p class="muted">Ara mateix no hi ha avisos ni reunions previstes.</p>';
  h += `<div class="card">${cos}</div>`;
  if (evs.length > AG_MAX_INICI) h += `<button class="link" data-s="agendaTota">Veure’n més (${evs.length - AG_MAX_INICI})</button>`;
  return sec + h;
}
function vAgendaTota(){
  const evs = properes();
  return `<h2>Properes reunions</h2><p class="muted" style="margin-top:4px">Tot el que hi ha previst els pròxims tres mesos.</p><div class="card" style="margin-top:14px">${evs.length ? evs.map(filaEvent).join('') : '<p class="muted">No hi ha res previst.</p>'}</div>`;
}
// Afegir al calendari del veí
const utc = ms => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
const peuCal = 'AVV Pla de Palau – Sant Pau · app.avsantpau.cat';
function googleCal(e){
  const dates = e.tot ? `${e.dia.replace(/-/g,'')}/${e.diaFi.replace(/-/g,'')}` : `${utc(e.ini)}/${utc(e.fi)}`;
  const p = new URLSearchParams({action:'TEMPLATE', text:e.t, dates, details:[e.desc, peuCal].filter(Boolean).join('\n\n'), location:e.lloc || ''});
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}
function baixaIcs(e){
  const t = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AVV Pla de Palau Sant Pau//App//CA','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    'UID:' + e.id.replace(/@.*/, '').replace(/[^\w-]/g, '') + '-' + e.dia + '@avsantpau.cat', 'DTSTAMP:' + utc(Date.now())];
  if (e.tot) L.push('DTSTART;VALUE=DATE:' + e.dia.replace(/-/g,''), 'DTEND;VALUE=DATE:' + e.diaFi.replace(/-/g,''));
  else L.push('DTSTART:' + utc(e.ini), 'DTEND:' + utc(e.fi));
  L.push('SUMMARY:' + t(e.t));
  if (e.lloc) L.push('LOCATION:' + t(e.lloc));
  L.push('DESCRIPTION:' + t([e.desc, peuCal].filter(Boolean).join('\n\n')), 'END:VEVENT', 'END:VCALENDAR');
  const txt = L.join('\r\n');
  if (esIOS()){ location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(txt); return; }
  const url = URL.createObjectURL(new Blob([txt], {type:'text/calendar;charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = (e.t.replace(/[^\wÀ-ÿ -]/g, '').trim() || 'reunio') + '.ics';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000);
}

  if (d.f){ S.filtre = d.f; render(); return; }
  if (d.fc){ S.fc = d.fc; render(); return; }
  if (d.curs){ sub({v:'curs', id:d.curs}); return; }
  if (d.s){
    if (d.s === 'avisosJ'){ S.avJ = null; S.avJErr = null; S.avEsb = null; }
    if (d.s === 'pendents'){ S.pend = null; S.pendErr = null; }
    sub({v:d.s}); return; }
  if (d.un){ S.avU = d.un; document.querySelectorAll('#vu button').forEach(x => x.classList.toggle('on', x.dataset.un === d.un)); actCad(); return; }
  if (d.sa){ const id = S.sub.id; if (d.sa === 'despAct' && !esSoci()){ S.after = {v:'despAct', id, up:{v:'detall', id}}; S.idPas = false; S.idDni = ''; sub({v:'ident', up:{v:'detall', id}}); return; } sub({v:d.sa, id, up:{v:'detall', id}}); return; }
  if (d.pag){ S.alta.pag = d.pag; keepAlta(); render(); restoreAlta(); return; }
  if (d.mov){ S.mov = d.mov; render(); return; }
  if (d.k !== undefined){ pinKey(d.k); return; }
  switch (d.a){
    case 'back': {
      const s = S.sub;
      if (s && s.up) sub(s.up);
      else if (s && s.v === 'pagament' && S.pag.back) sub(S.pag.back);
      else { S.sub = null; render(); }
      break; }
    case 'mes': { const a = act(S.sub.id); if (S.q < a.places - a.ocup) S.q++; render(); break; }
    case 'menys': if (S.q > 1) S.q--; render(); break;
    case 'ins': sub({v:'form', id:S.sub.id, up:{v:'inscriure', id:S.sub.id}}); break;
    case 'pagarIns': {
      const id = S.sub.id, a = act(id);
      const ok = req([['fn','Escriu el nom i cognoms'],['fe','Escriu un correu vàlid',isMail],['ft','Escriu un telèfon']]) & (id !== 'mercat' || req([['fx','Tria què vendràs']]));
      if (!ok) return;
      S.pag = {concepte:`${a.nom}, ${S.q} × ${a.u}`, import:preu(a)*S.q, back:{v:'form', id, up:{v:'inscriure', id}}, fet:() => { S.ins.push({id, q:S.q}); a.ocup += S.q; S.okMsg = {t:'Inscripció feta', s:`T’hem enviat la confirmació per correu. Ens veiem el ${a.d} ${a.m}.`, b:'Tornar a l’inici', go:'inici'}; }};
      sub({v:'pagament'}); break; }
    case 'pagar': {
      b.textContent = 'Processant…'; b.disabled = true;
      setTimeout(() => { S.pag.fet(); sub({v:'ok'}); }, 900); break; }
    case 'alta': S.alta = {pag:'targeta', fam:[]}; sub({v:'alta'}); break;
    case 'afegeix': keepAlta(); S.alta.fam.push({nom:'', dni:''}); render(); restoreAlta(); break;
    case 'treu': keepAlta(); S.alta.fam.splice(+d.i, 1); render(); restoreAlta(); break;
    case 'ferAlta': {
      let ok = req([['an','Escriu el nom i cognoms'],['ad','Escriu un DNI o NIE vàlid',isDni],['aa','Escriu l’adreça'],['ae','Escriu un correu vàlid',isMail],['at','Escriu un telèfon']]);
      if (S.alta.pag === 'domi'){ if (!req([['ai','Escriu un IBAN vàlid', v => /^ES\d{22}$/i.test(v.replace(/\s/g,''))]])) ok = false; if (!$('#am').checked){ err('am','Cal autoritzar la domiciliació'); ok = false; } }
      if (!$('#ar').checked){ err('ar','Cal llegir la informació sobre protecció de dades'); ok = false; }
      if (!ok) return;
      const n = 1 + S.alta.fam.length;
      const nou = {nom:val('an'), dni:val('ad').toUpperCase(), email:val('ae'), tel:val('at'), num:215 + Math.floor(Math.random()*20), pag:S.alta.pag}; nou.codi = 'PP' + nou.num + 'K';
      const fet = () => { nou.estat = S.alta.pag === 'domi' ? 'pendent' : 'pagada'; S.soci = nou; S.rol = 'soci'; marcaPriv(); S.okMsg = {t:'Benvingut a l’associació', s: S.alta.pag === 'domi' ? `Ja ets soci. La quota es cobrarà a la propera remesa.${n>1?' Cada persona tindrà el seu carnet.':''}` : `Ja ets soci i tens el carnet al mòbil.${n>1?' Cada persona tindrà el seu carnet.':''}`, b:'Veure el meu carnet', go:'soci'}; };
      if (S.alta.pag === 'targeta'){ S.pag = {concepte:`Quota de soci 2026, ${nou.nom}`, import:QUOTA*n, back:{v:'alta'}, fet}; sub({v:'pagament'}); }
      else { fet(); sub({v:'ok'}); }
      break; }
    case 'ident': S.after = null; S.idPas = false; S.idDni = ''; go('soci', {v:'ident'}); break;
    case 'idCodi': case 'reenvia': {
      if (d.a === 'idCodi'){ if (!req([['id','Aquest DNI o NIE no és correcte. Revisa els números i la lletra.',isDni]])) break; S.idDni = val('id'); }
      const txt = b.textContent; b.disabled = true; b.textContent = 'Enviant…';
      motor('solicitarCodi', {dni:S.idDni}).then(r => {
        b.disabled = false; b.textContent = txt;
        if (r.ok){ S.rsT = Date.now() + 60000; S.idPas = true; desaPendent(); render(); setTimeout(() => { const c = document.getElementById('ic'); if (c) c.focus(); }, 50); if (d.a === 'reenvia') toast('Codi reenviat'); return; }
        if (r.codi === 'BLOQUEJAT'){ S.bloq = Date.now() + 900000; render(); return; }
        if (d.a === 'reenvia') toast(MSG[r.codi] || MSG.SERVEI); else err('id', MSG[r.codi] || MSG.SERVEI);
      });
      break; }
    case 'canviaDni': esborraPendent(); S.idPas = false; render(); break;
    case 'instal':
      if (instPrompt){ instPrompt.prompt(); instPrompt.userChoice.then(() => { instPrompt = null; render(); }); }
      else { S.instAjuda = !S.instAjuda; render(); }
      break;
    case 'ajuda': sub({v:'ajuda', up:S.sub}); break;
    case 'sortirQ': S.confS = true; render(); break;
    case 'noSortir': S.confS = false; render(); break;
    case 'idCodiAntic': if (req([['id','Escriu un DNI o NIE vàlid',isDni]])){ S.idDni = val('id'); S.idPas = true; render(); } break;
    case 'idOk': {
      if (!req([['ic','El codi té 6 xifres. Copia’l tal com surt al correu.', v => /^\d{6}$/.test(v)]])) break;
      b.disabled = true; b.textContent = 'Comprovant…';
      const disp = (navigator.userAgent.match(/iPhone|iPad|Android[^;)]*|Windows|Mac OS X/) || ['Mòbil'])[0];
      motor('verificarCodi', {dni:S.idDni, codi:val('ic'), dispositiu:disp}).then(r => {
        b.disabled = false; b.textContent = 'Entrar';
        if (!r.ok){
          if (r.codi === 'INCORRECTE'){ err('ic', `Aquest codi no és correcte. Et queden ${r.intents} ${r.intents === 1 ? 'intent' : 'intents'}.`); return; }
          if (r.codi === 'BLOQUEJAT'){ S.bloq = Date.now() + 900000; render(); return; }
          if (r.codi === 'CADUCAT' || r.codi === 'ESGOTAT'){ esborraPendent(); S.idPas = false; render(); err('id', MSG[r.codi]); return; }
          err('ic', MSG[r.codi] || MSG.SERVEI); return;
        }
        desaToken(r.token); esborraPendent(); S.bloq = 0; S.idPas = false;
        aplicaPerfil(r.perfil, S.idDni.toUpperCase().replace(/[\s.-]/g,''));
        S.agCarr = false; carregaAgenda();
        toast(`Hola, ${r.perfil.nom}! Ja has entrat.`);
        if (S.after){ const t = S.after; S.after = null; sub(t); }
        else { S.sub = null; const t = S.afterTab || 'inici'; S.afterTab = null; go(t); }
      });
      break; }
    case 'sortir': motor('tancarSessio', {token:token()}); desaToken(''); S.confS = false; S.entrat = false; S.junta = false; S.rol = 'visitant'; S.soci = null; S.user = null; S.ins = []; oblidaAgenda(); toast('Sessió tancada'); go('inici'); break;
    case 'desaMov': if (req([['di','Escriu l’import', v => +v > 0],['dc','Escriu el concepte']])){ toast(S.mov === 'ing' ? 'Ingrés desat' : 'Despesa desada'); S.sub = null; render(); } break;
    case 'desaAct': {
      let ok = true;
      if (!esSoci() && !req([['dk','Aquest codi de soci no existeix. Mira’l al teu carnet.', v => /^PP\d{3}[A-Z]$/i.test(v)]])) ok = false;
      if (!req([['di','Escriu l’import', v => +v > 0],['dc','Escriu el concepte']])) ok = false;
      if (!ok) return;
      const id = S.sub.id; toast((S.mov === 'ing' ? 'Ingrés' : 'Despesa') + ' enviada al tresorer'); sub({v:'detall', id}); break; }
    case 'insCurs': {
      const id = S.sub.id, c = curs(id);
      if (c.ocup >= c.places){ toast('T’hem apuntat a la llista d’espera'); break; }
      S.pag = {concepte:`${c.nom}, primer trimestre`, import:esSoci()?c.ps:c.pn, back:{v:'curs', id}, fet:() => { c.ocup++; S.insC = (S.insC||[]).concat(id); S.okMsg = {t:'Inscripció feta', s:`Les comunicacions del curs de ${c.nom} et sortiran a la pantalla de Cursos i t’arribaran per correu.`, b:'Tornar als cursos', go:'cursos'}; }};
      sub({v:'pagament'}); break; }
    case 'avisos': { const id = S.sub.id; S.avs = S.avs || []; if (S.avs.includes(id)) S.avs = S.avs.filter(x => x !== id); else { S.avs.push(id); toast('Rebràs els avisos d’aquest curs'); } render(); break; }
    case 'enviaCom': {
      if (!req([['ct','Escriu el missatge']])) return;
      const c = curs(S.sub.id); AVISOS.unshift({c:c.id, d:'avui', t:val('ct'), de:S.user.nom.split(' ')[0] + ', ' + rolCurs(c.id).toLowerCase()}); toast(`Missatge enviat als ${c.ocup} inscrits`); render(); break; }
    case 'identC': S.after = null; S.afterTab = 'cursos'; S.idPas = false; S.idDni = ''; go('cursos', {v:'ident'}); break;
    case 'xarxa': toast(`Aquí s’obrirà ${d.n}`); break;
    case 'entraLogin': S.after = null; S.afterTab = 'inici'; S.idPas = false; S.idDni = ''; sub({v:'ident'}); break;
    case 'entraAlta': S.alta = {pag:'targeta', fam:[]}; sub({v:'alta'}); break;
    case 'convidat': S.entrat = true; S.sub = null; go('inici'); break;
    case 'privOk': marcaPriv(); if (token()) motor('privacitatVista', {token:token()}); window.scrollTo(0,0); render(); break;
    case 'privAlta': keepAlta(); S.privAlta = !S.privAlta; render(); restoreAlta(); break;
    case 'remesa': toast('Remesa de 12 rebuts preparada'); break;
    case 'pdf': toast('Informe preparat'); break;
    case 'nova': toast('Aquí s’obrirà el creador d’activitats'); break;
    case 'sortirJ': S.junta = false; S.pin = ''; go('inici'); break;
    // Avisos i agenda
    case 'afegeixCal': S.agObre = S.agObre === d.ev ? null : d.ev; S.agAmaga = null; render(); break;
    case 'ics': { const ev = properes().find(x => clauEv(x) === d.ev); if (ev) baixaIcs(ev); break; }
    case 'amagaQ': S.agAmaga = S.agAmaga === d.ev ? null : d.ev; S.agObre = null; render(); break;
    case 'amagaNo': S.agAmaga = null; render(); break;
    case 'decideix': {
      b.disabled = true;
      motor('juntaDecideix', {token:token(), id:d.id, dia:d.dia || '', estat:d.estat, t:d.t || ''}).then(r => {
        if (!r.ok){ b.disabled = false; toast(msgJ(r)); return; }
        toast({Publicat:'Publicat a l’app', Descartat:'Descartat. No sortirà a l’app.', Amagat:'Amagat de l’app', Esborra:'Torna a sortir a l’app'}[d.estat] || 'Fet');
        S.agAmaga = null; S.pend = null; S.agCarr = false; carregaAgenda(); render();
      });
      break; }
    case 'refrescaCal': S.pend = null; S.pendErr = null; S.pendRef = true; render(); break;
    case 'reintentaJ': S.avJErr = null; S.pendErr = null; render(); break;
    case 'nouAvis': S.avEd = null; S.avU = 'setmanes'; sub({v:'avisForm', up:{v:'avisosJ'}}); break;
    case 'editaAvis': { const a = (S.avJ || []).find(x => x.id === d.id); if (!a) break; S.avEd = Object.assign({}, a); S.avU = a.u; sub({v:'avisForm', up:{v:'avisosJ'}}); break; }
    case 'desaAvis': {
      if (!req([['vt','Escriu el títol de l’avís']])) return;
      const a = S.avEd || {};
      const dades = {token:token(), id:a.id || '', t:val('vt'), s:val('vs'), n:+val('vn'), u:S.avU || 'setmanes', dest:val('vd'), dst:$('#vx').checked};
      const txt = b.textContent; b.disabled = true; b.textContent = 'Desant…';
      motor('desaAvis', dades).then(r => {
        b.disabled = false; b.textContent = txt;
        if (!r.ok){ toast(msgJ(r)); return; }
        toast(a.id ? 'Canvis desats' : 'Avís publicat');
        S.avJ = null; S.avEd = null; S.agCarr = false; carregaAgenda(); sub({v:'avisosJ'});
      });
      break; }
    case 'esborraQ': S.avEsb = d.id; render(); break;
    case 'esborraNo': S.avEsb = null; render(); break;
    case 'esborraAvis': {
      b.disabled = true;
      motor('esborraAvis', {token:token(), id:d.id}).then(r => {
        if (!r.ok){ b.disabled = false; toast(msgJ(r)); return; }
        toast('Avís esborrat'); S.avEsb = null; S.avJ = null; S.agCarr = false; carregaAgenda(); render();
      });
      break; }
  }
});
let altaTmp = {};
function keepAlta(){ altaTmp = {}; ['an','ad','aa','ae','at','ai'].forEach(i => altaTmp[i] = val(i)); ['ar','am'].forEach(i => { const e = document.getElementById(i); if (e) altaTmp[i] = e.checked; }); }
function restoreAlta(){ Object.entries(altaTmp).forEach(([k,v]) => { const e = document.getElementById(k); if (!e) return; if (typeof v === 'boolean') e.checked = v; else e.value = v; }); }
function pinKey(k){
  if (k === '⌫') S.pin = S.pin.slice(0,-1);
  else if (S.pin.length < 4) S.pin += k;
  render();
  if (S.pin.length === 4){
    if (S.pin === '1234'){ S.junta = true; S.pin = ''; toast('Accés de junta activat'); render(); }
    else { S.pin = ''; render(); err('pin','PIN incorrecte. Torna-ho a provar.'); }
  }
}
function desa(){ try { const log = !!(S.user || S.soci); if (log) localStorage.setItem('avv-sessio-v2', JSON.stringify({rol:S.rol, soci:S.soci, user:S.user})); else localStorage.removeItem('avv-sessio-v2'); localStorage.removeItem('avv-sessio'); sessionStorage.setItem('avv-convidat', (!log && S.entrat) ? '1' : ''); } catch(e){} }
function recupera(){ try { const d = JSON.parse(localStorage.getItem('avv-sessio-v2') || 'null'); if (d && (d.user || d.soci)){ Object.assign(S, d); S.entrat = true; } else if (sessionStorage.getItem('avv-convidat') === '1') S.entrat = true; } catch(e){} }
recupera();
// Avisos i agenda: es mostra al moment l'última còpia d'aquest mòbil i s'actualitza en segon pla
function oblidaAgenda(){ S.ag = null; try { localStorage.removeItem('avv-agenda'); } catch(e){} S.agCarr = false; carregaAgenda(); }
try { const c = JSON.parse(localStorage.getItem('avv-agenda') || 'null'); if (c && c.ok && (token() || c.nivell === 'convidat')) S.ag = c; } catch(e){}
document.addEventListener('change', e => { if (e.target.id === 'vn') actCad(); });
carregaAgenda();
if (!token()){ const pd = llegeixPendent(); if (pd){ S.idDni = pd.dni; S.idPas = true; S.rsT = pd.t + 60000; S.after = pd.after; S.afterTab = pd.afterTab; S.sub = {v:'ident'}; } }
if (!token() && (S.soci || S.user)){ S.soci = null; S.user = null; S.rol = 'visitant'; S.entrat = false; }
if (token()) motor('sessio', {token:token()}).then(r => {
  if (r.ok){ aplicaPerfil(r.perfil); if (!r.perfil) toast('No consta com a soci aquest any. Escriu-nos si és un error.'); render(); }
  else if (r.codi === 'SESSIO_CADUCADA'){ desaToken(''); S.soci = null; S.user = null; S.rol = 'visitant'; S.entrat = false; S.sub = null; oblidaAgenda(); render(); toast('La sessió ha caducat. Torna a entrar amb el teu DNI.'); }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('hashchange', () => { if (!S.keep) S.sub = null; S.keep = false; render(); window.scrollTo(0,0); });
render();
</script>
